version: "1.0"
description: "Kök – vitvaror, köksfläkt, spis/ugn/häll, köksrenovering m.m."
tasks:
  # -----------------------------------------------------
  # KÖK – SPIS / UGN / HÄLL
  # -----------------------------------------------------

  installera_spis_ugn:
    label: "Installera spis/ugn"
    category: "kok"
    patterns:
      - "installera spis"
      - "installera ugn"
      - "ansluta spis"
      - "ansluta ugn"
      - "koppla in spis"
      - "koppla in ugn"
    time_source: "manual"
    atl_refs: []
    manual_time_minutes_per_unit: 60
    pricing_source: "manual"
    material_suggestions:
      - "anslutningskabel spis"
    notes: "Elanslutning eller byte av spis/ugn. Förutsätter framdragen grupp."

  byta_spis_ugn:
    label: "Byta spis/ugn"
    category: "kok"
    patterns:
      - "ersätta spis"
      - "ersätta ugn"
      - "ta bort gammal spis och sätta dit ny"
    time_source: "manual"
    atl_refs: []
    manual_time_minutes_per_unit: 45
    pricing_source: "manual"
    material_suggestions:
      - "anslutningskabel spis"
    notes: "Byte av spis/ugn på befintlig anslutning."

  installera_hall:
    label: "Installera häll"
    category: "kok"
    patterns:
      - "installera häll"
      - "installera induktionshäll"
      - "koppla in häll"
      - "byta häll"
    time_source: "manual"
    atl_refs: []
    manual_time_minutes_per_unit: 60
    pricing_source: "manual"
    material_suggestions:
      - "anslutningskabel häll"
    notes: "Installation eller byte av häll, separat från ugn."

  # -----------------------------------------------------
  # KÖK – DISKMASKIN / ANDRA VITVAROR
  # -----------------------------------------------------

  installera_diskmaskin:
    label: "Installera diskmaskin"
    category: "kok"
    patterns:
      - "installera diskmaskin"
      - "ansluta diskmaskin"
      - "koppla in diskmaskin"
      - "byta diskmaskin"
    time_source: "manual"
    atl_refs: []
    manual_time_minutes_per_unit: 45
    pricing_source: "manual"
    material_suggestions:
      - "anslutningskabel diskmaskin"
    notes: "Elanslutning/byte av diskmaskin. Vatten/avlopp hanteras av VVS."

  installera_inbyggd_mikro:
    label: "Installera inbyggd mikrovågsugn"
    category: "kok"
    patterns:
      - "montera inbyggd mikrovågsugn"
      - "installera inbyggd mikro"
      - "koppla in inbyggd mikro"
    time_source: "manual"
    atl_refs: []
    manual_time_minutes_per_unit: 45
    pricing_source: "manual"
    material_suggestions: []
    notes: "Installation av inbyggd mikrovågsugn i kök."

  # -----------------------------------------------------
  # KÖK – KÖKSFLÄKT / SPISFLÄKT
  # -----------------------------------------------------

  installera_koksflakt:
    label: "Installera/byta köksfläkt"
    category: "kok"
    patterns:
      - "byta köksfläkt"
      - "installera köksfläkt"
      - "byta spisfläkt"
      - "installera spisfläkt"
    time_source: "manual"
    atl_refs: []
    manual_time_minutes_per_unit: 60
    pricing_source: "manual"
    material_suggestions: []
    notes: "Installation eller byte av köksfläkt/spisfläkt, elanslutning ingår."

  # -----------------------------------------------------
  # KÖK – KÖKSRENOVERING / NYINSTALLATION
  # -----------------------------------------------------

  installera_koksrenovering_el:
    label: "Köksrenovering (el-nyinstallation)"
    category: "kok"
    patterns:
      - "köksrenovering"
      - "dra om el i kök"
      - "ny el i kök"
      - "el vid köksrenovering"
    time_source: "manual"
    atl_refs: []
    manual_time_minutes_per_unit: 480
    pricing_source: "manual"
    material_suggestions:
      - "kabel"
      - "apparatdosor"
      - "vägguttag"
    notes: "Övergripande nyinstallation av el i samband med större köksrenovering."

  installera_matning_till_kok:
    label: "Installera ny matning till kök"
    category: "kok"
    patterns:
      - "dra ny matning till köket"
      - "ny grupp till köket"
      - "extra säkring till köket"
      - "dra ny matning till diskmaskin"
      - "ny matning till diskmaskin"
      - "dra matning till diskmaskin"
      - "diskmaskin från central"
    time_source: "manual"
    atl_refs: []
    manual_time_minutes_per_unit: 90
    pricing_source: "manual"
    material_suggestions:
      - "kabel"
    notes: "Ny matning från central till kök, t.ex. för spis eller extra grupper."

  # -----------------------------------------------------
  # KÖK – FELSÖKNING (VITVAROR)
  # -----------------------------------------------------

  felsokning_kok_vitvaror:
    label: "Felsökning vitvaror i kök"
    category: "kok"
    patterns:
      - "spis och diskmaskin fungerar inte"
      - "vitvaror i kök fungerar inte"
      - "felsöka vitvaror i kök"
      - "felsökning matning kök"
    time_source: "manual"
    atl_refs: []
    manual_time_minutes_per_unit: 90
    pricing_source: "manual"
    material_suggestions: []
    notes: "Övergripande felsökning av matningar till vitvaror i kök."
